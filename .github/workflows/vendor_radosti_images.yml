name: Download Radosti Nails images into repository

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/vendor_radosti_images.yml'
      - 'scripts/vendor_radosti_images.py'

permissions:
  contents: write

concurrency:
  group: radosti-image-import
  cancel-in-progress: false

jobs:
  vendor-images:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install imaging dependencies
        run: python -m pip install --quiet requests Pillow
      - name: Download and convert all remote images
        run: python scripts/vendor_radosti_images.py
      - name: Commit local assets and HTML links
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/ index.html
          if git diff --cached --quiet; then
            echo "No new asset changes to commit."
          else
            git commit -m "Store all Radosti Nails images locally; remove remote image URLs"
            git push origin HEAD:main
          fi
